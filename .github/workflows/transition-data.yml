name: Transition data preparation
on:
  push:
    branches: [feat/energy-transition]
    paths:
      - scripts/transition_probe.py
      - scripts/prepare_transition_data.py
      - .github/workflows/transition-data.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/transition_probe.py
